<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #ff6b6b, #f7b733, #4ecdc4, #556fb5);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  h1 {
    color: white;
    font-family: Arial, sans-serif;
    font-size: 3rem;
    text-shadow: 0 4px 10px rgba(0,0,0,0.3);
    z-index: 10;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .shape {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    animation: float 8s ease-in-out infinite;
  }

  .shape:nth-child(1) { width: 80px; height: 80px; left: 10%; top: 20%; animation-duration: 7s; }
  .shape:nth-child(2) { width: 120px; height: 120px; left: 70%; top: 15%; animation-duration: 9s; animation-delay: 1s; }
  .shape:nth-child(3) { width: 60px; height: 60px; left: 80%; top: 70%; animation-duration: 6s; animation-delay: 2s; }
  .shape:nth-child(4) { width: 100px; height: 100px; left: 20%; top: 75%; animation-duration: 10s; animation-delay: 0.5s; }
  .shape:nth-child(5) { width: 50px; height: 50px; left: 45%; top: 40%; animation-duration: 8s; animation-delay: 1.5s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    33% { transform: translateY(-40px) translateX(20px); }
    66% { transform: translateY(20px) translateX(-20px); }
  }
</style>
</head>
<body>

  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>

  <h1>Ma première page web ✨</h1>

</body>
</html>
